# documentation https://goreleaser.com
version: 2

project_name: apipig

before:
  hooks:
    - go mod verify
    - go test ./version -args -expected-version={{ .Version }}

builds:
  - id: apipig
    main: .
    binary: apipig
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X apipig/version.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    goarm:
      - '7'
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
  - id: remote-agent
    main: ./cmd/remote-agent
    binary: remote-agent
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X apipig/version.Version={{ .Version }}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - '386'
      - arm
      - arm64
    goarm:
      - '7'
    ignore:
      - goos: darwin
        goarch: '386'
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm

archives:
  - id: apipig
    ids:
      - apipig
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
  - id: remote-agent
    ids:
      - remote-agent
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      apipig-remote-agent_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - src: cmd/remote-agent/remote-agent.example.yaml
        dst: remote-agent.example.yaml
      - src: docs/remote-agent.md

checksum:
  name_template: apipig_{{ .Version }}_checksums.txt
  algorithm: sha256

snapshot:
  version_template: >-
    {{- $line := filter (mustReadFile "version/version.go") "^const Default = \"[^\"]+\"[[:space:]]*$" -}}
    {{- trimsuffix (trimprefix (trim $line) "const Default = \"") "\"" -}}

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
